<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
<style>{{CSS}}</style>
<div class="app">
  <header class="topbar">
    <button type="button" class="menu-btn" id="menu-btn" aria-expanded="false" aria-controls="sidebar">Innehåll</button>
    <a class="brand" href="#hem">{{TITLE}}</a>
    <div class="search" role="search">
      <input type="search" id="search" placeholder="Sök i anteckningarna" autocomplete="off" aria-label="Sök i anteckningarna">
      <div class="results" id="results" hidden></div>
    </div>
  </header>
  <nav class="sidebar" id="sidebar" aria-label="Innehåll">{{NAV}}</nav>
  <main class="sheet" id="main">
{{VIEWS}}
  </main>
</div>
<script>
window.MathJax = {
  tex: {
    inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']],
    packages: {'[+]': ['html', 'cancel', 'color', 'mhchem', 'textmacros', 'enclose']},
    macros: {textsuperscript: ['^{#1}', 1], textcircled: ['\\enclose{circle}{\\kern1mu{#1}\\kern1mu}', 1]}
  },
  options: {ignoreHtmlClass: 'mj-defer', processHtmlClass: 'mj-now'},
  svg: {fontCache: 'global', mtextInheritFont: true},
  startup: {typeset: false}
};
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg-full.js"></script>
<script>{{JS}}</script>
